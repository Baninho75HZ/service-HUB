<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceHub - Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body class="dashboard-body" style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 30px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2>ServiceHub</h2>
            <p style="color: #718096; font-size: 14px;">Entre na sua conta para continuar</p>
        </div>

        <!-- Formulário de Login -->
        <form id="login-form">
            <div style="margin-bottom: 16px;">
                <label for="email" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500;">E-mail</label>
                <input type="email" id="email" required style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="senha" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500;">Senha</label>
                <input type="password" id="senha" required style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box;">
            </div>

            <button type="submit" id="btn-login" style="width: 100%; background: #ff5722; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer;">Entrar no Sistema</button>
        </form>

        <!-- Mensagens -->
        <div id="login-message" style="margin-top: 15px; text-align: center; font-size: 14px;"></div>
    </div>

    <!-- Caminho correto saindo da pasta pages/ e entrando em js/Firebase/ -->
    <script type="module" src="../js/Firebase/login.js"></script>
</body>
</html>
